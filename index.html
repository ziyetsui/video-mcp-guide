const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const shellQuote = s => "'" + s.replace(/'/g, "'\"'\"'") + "'";
const pl = {q:'',idx:0};
const pad = i => String(i+1).padStart(2,'0');
const copyBtn = text => `<button class="copy" type="button" data-copy="${esc(text)}" aria-label="复制"><span class="idle">复制</span><span class="done" aria-hidden="true">已复制</span></button>`;
const prompt = (label,text) => `<div class="prompt"><div class="prompt-head"><span>${esc(label)}</span>${copyBtn(text)}</div><pre class="prompt-body">${esc(text)}</pre></div>`;
const tools = arr => `<div class="tools">${arr.map(t=>`<span class="tool">${esc(t)}</span>`).join('')}</div>`;
const TEST_PROMPT = '列出 video-mcp 的全部工具，然后只调用一次 vmcp_get_usage 查询今日花费和剩余额度。不要发起搜索、拆解、brief、复刻或素材包任务。';
const FIX_PROMPT = '我在连接 video-mcp。接入地址是 https://video-mcp-ziye.zeabur.app/mcp。客户端是「填写客户端」。报错是：\n「粘贴报错，删去 Token」\n请检查客户端配置、HTTP 传输和 Authorization Bearer 请求头，再验证工具列表和 vmcp_get_usage。不要执行付费业务任务，不要输出我的令牌。';
function configOf(name) {
 const token = personalToken || '<你的 VMCP_AUTH_TOKEN>';
 let text,note;
 if(name==='Claude Code') {
  const auth = shellQuote('Authorization: Bearer '+token);
  text = 'claude mcp add --scope user --transport http video-mcp '+ENDPOINT+' --header '+auth;
  note = personalToken ? '在终端运行，写入 Claude Code 用户级配置；重新开启会话后即可使用。已有同名配置时，请先检查原配置。' : '在上方填入获授权的接入 Token 后复制命令。写入用户级配置，重新开启 Claude Code 会话即可使用；已有同名配置无需重复添加。';
 } else if(name==='Codex CLI') {
  text = ['export VMCP_AUTH_TOKEN='+shellQuote(token),'codex mcp add video-mcp --url '+ENDPOINT+' --bearer-token-env-var VMCP_AUTH_TOKEN','codex'].join(String.fromCharCode(10));
  note = '在同一个终端运行。令牌由环境变量提供，再从这个终端启动 Codex；新开终端时需重新设置变量。';
 } else {
  text = JSON.stringify({mcpServers:{'video-mcp':{...(name==='通用 JSON'?{type:'http'}:{}),url:ENDPOINT,headers:{Authorization:'Bearer '+token}}}},null,2);
  note = name==='Cursor' ? '写入 ~/.cursor/mcp.json（与已有服务器合并）。先在上方填入自己的 Token，再复制配置。' : '供支持远程 HTTP MCP 和自定义请求头的客户端使用。先填 Token，按客户端要求合并 mcpServers 配置。';
 }
 return {text,note};
}
function plEntries(){
 const e=[{g:'接入',ic:'1',t:'线上接入地址',sub:'HTTP · Bearer',d:'这是接口，不是网页。浏览器直接打开会缺少Bearer令牌；请配置到支持HTTP与自定义请求头的MCP客户端。',copy:ENDPOINT,copyLabel:'地址',code:ENDPOINT}];
 e.push({g:'排障',ic:'?',t:'地址打不开：先看健康检查',sub:'网页与接口不同',d:'根地址404是没有网页首页；MCP无令牌401是鉴权要求。healthz应返回200和ok:true；带令牌GET可能保持事件流，不显示操作网页。',copy:'https://video-mcp-ziye.zeabur.app/healthz',copyLabel:'健康检查地址',code:'https://video-mcp-ziye.zeabur.app/healthz',kw:'打不开 404 401 空白 一直加载 健康检查'});
 for(const name of ['Claude Code','Codex CLI','Cursor','通用 JSON']){
  const c=configOf(name); e.push({g:'接入',ic:'2',t:name+' 配置',sub:name==='Claude Code'?'复制命令，即可接入':'客户端配置',d:c.note,copy:c.text,copyLabel:'配置',code:c.text,kw:'安装 add config 设置'});
 }
 e.push({g:'接入',ic:'3',t:'验证连接，不发起付费任务',sub:'列工具 · 查额度',d:'把这句话发给已接入的 AI。2026-10-30已验证原生MCP客户端连接、发现16个工具并成功读取usage。',copy:TEST_PROMPT,copyLabel:'提示词',tools:['vmcp_get_usage']});
 C.plays.forEach(([t,lv,cat,d,p,ts],i)=>e.push({g:'玩法',ic:pad(i),t,sub:lv+' · '+cat,d,copy:p,copyLabel:'提示词',tools:ts,lv}));
 C.can.forEach(([ic,t,d,ts])=>e.push({g:'能做什么',ic,t,sub:ts.length+' 个工具',d,copy:ts.join(', '),copyLabel:'工具名',tools:ts}));
 e.push({g:'排障',ic:'!',t:'接不上，让 AI 检查配置',sub:'401 · 报错 · 连接失败',d:'401 先检查 Token 和 Bearer 请求头；502/503 先检查服务状态。把脱敏报错交给 AI，修好后只查工具和额度验证。',copy:FIX_PROMPT,copyLabel:'提示词',kw:'错误 修复 失败 鉴权'});
 C.notes.forEach(([t,d])=>e.push({g:'注意事项',ic:'●',t,sub:'使用边界',d,copy:t+'：'+d,copyLabel:'说明'}));
 return e;
}
function renderPalette(){return `<main class="pl"><div class="pl-wrap">
 <div class="pl-topline"><div class="pl-head"><span class="brand"><span class="logo" aria-hidden="true"></span>video-mcp</span></div><span class="pl-badge">16 TOOLS / HTTP MCP</span></div>
 <h1>${esc(C.title)}</h1><p class="pl-sub">找参考、拆结构、写 brief、出样稿。接入配置和 12 个玩法，都能在这里找到、复制，交给你的 AI。</p>
 <div class="pl-notice"><strong>接入已验证 · 业务调用待充值</strong><br>截至 2026-10-29，服务已部署；TikHub 仍欠费，真实搜索和拆解需充值后使用。先用「查额度」确认连接。</div>
 <details class="pl-personal" open><summary>填入接入 Token，复制可直接运行的配置</summary><label for="vmcp-token">VMCP_AUTH_TOKEN</label><div class="token-row"><input id="vmcp-token" type="password" placeholder="粘贴 Token，仅保留在当前页面" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="token-note"><button class="chip" type="button" data-clear-token>清空</button></div><p id="token-note">向服务提供方获取 VMCP_AUTH_TOKEN；填入后，下面的配置自动替换为你的值。不会保存到浏览器，也不会由本页发往服务端。</p></details>
 <section class="pl-box" aria-label="MCP 指南搜索面板"><label class="pl-input"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input type="search" data-pl-q placeholder="搜：Claude 配置、找爆款、brief、费用…" aria-label="搜索接入、玩法和工具" role="combobox" aria-expanded="true" aria-controls="pl-list" autocomplete="off" spellcheck="false"><kbd>/</kbd></label>
 <div class="pl-grid"><div class="pl-results" id="pl-list" role="listbox" aria-label="指南条目"></div><div class="pl-preview" data-pl-preview></div></div>
 <div class="pl-foot"><span class="hint"><kbd>↑</kbd> <kbd>↓</kbd> 选择</span><span class="hint"><kbd>↵</kbd> 复制</span><span class="hint"><kbd>esc</kbd> 清空</span><span class="spacer"></span><span data-pl-status role="status" aria-live="polite"></span></div></section>
 <div class="pl-try">试试：${['Claude Code','找爆款','拆解','brief','样稿','素材包','费用','报错'].map(w=>`<button class="chip" type="button" data-pl-try="${esc(w)}">${esc(w)}</button>`).join('')}</div>
 <footer class="pl-bottom"><span>搜索 → 拆解 → brief → 3 份样稿 → 任务素材包</span><span>复制配置或提示词，不会直接执行任务</span></footer>
 </div></main>`;}
async function writeClipboard(text){
 if(navigator.clipboard && window.isSecureContext){try{await navigator.clipboard.writeText(text);return;}catch{}}
 const prev=document.activeElement,t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(t);t.select();let ok=false;
 try{ok=document.execCommand('copy');}finally{t.remove();if(prev instanceof HTMLElement)prev.focus({preventScroll:true});}
 if(!ok)throw new Error('clipboard unavailable');
}
function requestToken(){const token=document.getElementById("vmcp-token");token.closest("details").open=true;token.focus();}
function hydratePalette(root){
 const q=root.querySelector('[data-pl-q]'),list=root.querySelector('#pl-list'),prev=root.querySelector('[data-pl-preview]'),status=root.querySelector('[data-pl-status]');let shown=[],timer;
 function setStatus(text,ok=false){clearTimeout(timer);status.textContent=text;status.toggleAttribute('data-ok',ok);if(ok)timer=setTimeout(()=>setStatus(shown.length+' 项'),1800);}
 function preview(){const x=shown[pl.idx];if(!x){prev.replaceChildren();return;}prev.innerHTML=`<div class="grp">${esc(x.g)}${x.lv?' · '+esc(x.lv):''}</div><h3 style="margin-top:6px">${esc(x.t)}</h3><p>${esc(x.d)}</p>${x.code?`<div class="prompt cfg"><div class="prompt-head"><span>${esc(x.copyLabel)}</span>${copyBtn(x.copy)}</div><pre>${esc(x.code)}</pre></div>`:prompt(x.copyLabel,x.copy)}${x.tools?tools(x.tools):''}`;}
 function highlight(scroll){q.removeAttribute('aria-activedescendant');list.querySelectorAll('.pl-item').forEach(el=>{const on=Number(el.dataset.i)===pl.idx;el.setAttribute('aria-selected',String(on));if(on){q.setAttribute('aria-activedescendant',el.id);if(scroll)el.scrollIntoView({block:'nearest'});}});preview();}
 function filter(){const words=pl.q.trim().toLowerCase().split(/\s+/).filter(Boolean);shown=plEntries().filter(x=>{const text=[x.t,x.sub,x.d,x.g,x.kw||'',...(x.tools||[])].join(' ').toLowerCase();return words.every(w=>text.includes(w));});pl.idx=Math.min(Math.max(pl.idx,0),Math.max(shown.length-1,0));
  if(!shown.length){q.removeAttribute('aria-activedescendant');list.innerHTML=`<div class="pl-empty">没有匹配「${esc(pl.q)}」的内容<br><span style="font-size:12px;color:var(--text-4)">换个词，或按 esc 清空</span></div>`;prev.replaceChildren();setStatus('0 项');return;}
  let g='';list.innerHTML=shown.map((x,i)=>{const head=x.g!==g?`<div class="pl-gl" role="presentation">${esc(x.g)}</div>`:'';g=x.g;return `${head}<div class="pl-item" role="option" id="pl-o${i}" data-i="${i}" aria-selected="false"><span class="ic" aria-hidden="true">${esc(x.ic)}</span><span>${esc(x.t)}</span><span class="sub">${esc(x.sub)}</span></div>`;}).join('');setStatus(shown.length+' 项');highlight(false);}
 async function copyCurrent(){const x=shown[pl.idx];if(!x)return;if(x.copyLabel==='配置'&&!personalToken){requestToken();setStatus('先填入接入 Token，再复制配置');return;}try{await writeClipboard(x.copy);setStatus('已复制'+x.copyLabel+'：'+x.t,true);}catch{setStatus('复制未成功，请选择右侧文本手动复制');}}
 q.addEventListener('input',()=>{pl.q=q.value;pl.idx=0;filter();});
 q.addEventListener('keydown',e=>{if(e.isComposing)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!shown.length)return;pl.idx=Math.max(0,Math.min(pl.idx+(e.key==='ArrowDown'?1:-1),shown.length-1));highlight(true);}else if(e.key==='Enter'){e.preventDefault();copyCurrent();}else if(e.key==='Escape'){e.preventDefault();q.value=pl.q='';pl.idx=0;filter();}});
 list.addEventListener('mousemove',e=>{const it=e.target.closest('.pl-item');if(it&&Number(it.dataset.i)!==pl.idx){pl.idx=Number(it.dataset.i);highlight(false);}});
 list.addEventListener('click',e=>{const it=e.target.closest('.pl-item');if(it){pl.idx=Number(it.dataset.i);highlight(false);copyCurrent();}});
 root.addEventListener('click',e=>{const chip=e.target.closest('[data-pl-try]');if(chip){q.value=pl.q=chip.dataset.plTry;pl.idx=0;filter();q.focus({preventScroll:true});}});
 const token=root.querySelector('#vmcp-token');token.addEventListener('input',()=>{personalToken=token.value.trim();filter();});root.querySelector('[data-clear-token]').addEventListener('click',()=>{token.value=personalToken='';filter();token.focus();});
 root.addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;if(b.dataset.copy.includes('<你的 VMCP_AUTH_TOKEN>')){requestToken();setStatus('先填入接入 Token，再复制配置');return;}try{await writeClipboard(b.dataset.copy);b.setAttribute('data-copied','');clearTimeout(b._t);b._t=setTimeout(()=>b.removeAttribute('data-copied'),1600);setStatus('已复制',true);}catch{setStatus('复制未成功，请手动选择文本');}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.target.isContentEditable&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){e.preventDefault();q.focus();}});
 filter();pl.idx=1;highlight(false);if(matchMedia('(pointer:fine)').matches)q.focus({preventScroll:true});
}
const app=document.getElementById('app');app.innerHTML=renderPalette();hydratePalette(app.firstElementChild);
</script></body></html>
